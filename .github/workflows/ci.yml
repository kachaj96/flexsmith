name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the APK to a release when a v* tag is pushed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle', 'android/variables.gradle') }}
          restore-keys: gradle-
      - run: npm ci
      - run: npm run cap:sync

      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Prepare signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.FLEXSMITH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/flexsmith.jks"
            echo "FLEXSMITH_KEYSTORE_FILE=$RUNNER_TEMP/flexsmith.jks" >> "$GITHUB_ENV"
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No FLEXSMITH_KEYSTORE_BASE64 secret. Building a DEBUG apk. It cannot be updated in place by a later build, see docs/RELEASE.md"
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build apk
        working-directory: android
        env:
          FLEXSMITH_KEYSTORE_PASSWORD: ${{ secrets.FLEXSMITH_KEYSTORE_PASSWORD }}
          FLEXSMITH_KEY_ALIAS: ${{ secrets.FLEXSMITH_KEY_ALIAS }}
          FLEXSMITH_KEY_PASSWORD: ${{ secrets.FLEXSMITH_KEY_PASSWORD }}
        run: |
          task=assembleDebug; [ "${{ steps.key.outputs.mode }}" = "release" ] && task=assembleRelease
          # downloads (the Gradle distribution, dependencies) sometimes fail with a 5xx on the host side: retry before giving up
          for i in 1 2 3 4; do ./gradlew --no-daemon $task && exit 0; echo "::warning::build attempt $i failed, retrying"; sleep $((i * 20)); done
          exit 1

      - name: Name the apk
        id: apk
        run: |
          v=$(node -p "require('./package.json').version")
          mode=${{ steps.key.outputs.mode }}
          src=$(ls android/app/build/outputs/apk/$mode/*.apk | head -n1)
          out="flexsmith-$v-$mode.apk"
          cp "$src" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "### $out" >> "$GITHUB_STEP_SUMMARY"
          unzip -p "$out" AndroidManifest.xml >/dev/null && echo "apk opens as a zip: ok" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') && steps.key.outputs.mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.file }}
