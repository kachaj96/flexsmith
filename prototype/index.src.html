<!doctype html>
<html lang="pl" data-smith-product="flexsmith">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Flexsmith: prototyp do akceptacji</title>
<style>
/*FONTS*/
/* ===== Smith Design System v1 tokens (smith-design-system-v1/smith-tokens-v1.css) + Flexsmith product accent ===== */
:root,[data-smith-theme="light"]{color-scheme:light;
  --smith-bg:#f4f5f6;--smith-surface:#fff;--smith-surface-muted:#eef1f3;--smith-surface-elevated:#e3e7eb;--smith-text:#151a21;--smith-text-secondary:#56606d;
  --smith-border-subtle:#e4e8ec;--smith-border-strong:#7e8893;--smith-positive:#22663d;--smith-positive-soft:#e2f2e8;--smith-danger:#b8322a;--smith-danger-soft:#fde7e4;
  --smith-warning:#8f4f00;--smith-warning-soft:#fcefd9;--smith-glass:rgba(248,249,250,.78);--smith-scrim:rgba(18,22,27,.35);
  --smith-shadow:0 1px 2px rgba(18,22,27,.04),0 12px 32px -14px rgba(18,22,27,.16);
  --smith-font-display:"Manrope Variable",Manrope,Inter,system-ui,sans-serif;--smith-font-body:"Inter Variable",Inter,system-ui,Roboto,"Segoe UI",sans-serif;
  --smith-radius-control:12px;--smith-radius-card:22px;--smith-radius-modal:24px;--smith-radius-pill:999px;
  --smith-motion-fast:120ms;--smith-motion-standard:220ms;--smith-motion-deliberate:300ms;--smith-spring:cubic-bezier(.2,.9,.25,1.04);--smith-bouncy:cubic-bezier(.3,1.4,.5,1);
  /* Flexsmith: the tile keeps the approved #8071B4 (graphic, white mark 4.25:1); text and buttons use a darker violet that passes 4.5:1 */
  --smith-accent:#6a5ba0;--smith-accent-soft:#ece8f6;--smith-on-accent:#fff;--tile:#8071b4;
  --t-prep:#a8620d;--t-mob:#1f6f5c;--t-stat:#4a63a8;--t-roll:#9a4a73;
}
[data-smith-theme="dark"]{color-scheme:dark;
  --smith-bg:#0b0e11;--smith-surface:#161a1f;--smith-surface-muted:#20262d;--smith-surface-elevated:#2a3139;--smith-text:#e9edf1;--smith-text-secondary:#a3adb8;
  --smith-border-subtle:#2a3139;--smith-border-strong:#6b7580;--smith-positive:#7fd39f;--smith-positive-soft:#16301f;--smith-danger:#ff9a8f;--smith-danger-soft:#43201d;
  --smith-warning:#f2b866;--smith-warning-soft:#3a2a12;--smith-glass:rgba(20,24,29,.78);--smith-scrim:rgba(0,0,0,.55);
  --smith-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 12px 32px -14px rgba(0,0,0,.6);
  --smith-accent:#b3a6e6;--smith-accent-soft:#241f3a;--smith-on-accent:#14102a;
  --t-prep:#e0a050;--t-mob:#5fc2a8;--t-stat:#8fa6e6;--t-roll:#e08fb8;
}
@media (prefers-reduced-motion:reduce){:root{--smith-motion-fast:0ms;--smith-motion-standard:0ms;--smith-motion-deliberate:0ms}}
html[data-motion="reduce"]{--smith-motion-fast:0ms;--smith-motion-standard:0ms;--smith-motion-deliberate:0ms}
/* ===== base ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--smith-bg);color:var(--smith-text);font:16px/1.45 var(--smith-font-body)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--smith-accent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#stage{min-height:100%;display:grid;place-items:center;background:var(--smith-bg)}
#phone{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;overflow:hidden;background:var(--smith-bg);isolation:isolate}
@media (min-width:600px){#stage{background:#d9dde2;padding:24px}[data-smith-theme="dark"]#stage{background:#050607}
  #phone{height:860px;max-height:calc(100vh - 48px);border-radius:44px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45),0 0 0 10px #101317}}
.scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px calc(104px + env(safe-area-inset-bottom));scroll-padding-bottom:110px}
.page{position:absolute;inset:0;background:var(--smith-bg);z-index:20;display:flex;flex-direction:column;animation:slide var(--smith-motion-deliberate) var(--smith-spring) both}
.page .scroll{position:relative;inset:auto;flex:1;min-height:0;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
@keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fade-in{animation:rise var(--smith-motion-standard) var(--smith-spring) both}
/* ===== header, headings ===== */
.hdr{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding-top:max(8px,env(safe-area-inset-top))}
.lockup{display:flex;align-items:center;gap:10px}
.lockup .mk{width:28px;height:28px;flex:none}
.lockup b{font:800 20px/1 var(--smith-font-display);letter-spacing:-.01em}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--smith-text)}
.ib:active{transform:scale(.94);transition:transform var(--smith-motion-fast)}
.ib svg,.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font:800 32px/1.1 var(--smith-font-display);letter-spacing:-.02em;margin:8px 0 2px}
.sub{color:var(--smith-text-secondary);font-size:15px;margin:0 0 16px}
h2{font:700 18px/1.3 var(--smith-font-display);margin:24px 0 10px}
.cap{font-size:12px;line-height:16px;color:var(--smith-text-secondary)}
/* ===== components ===== */
.card{background:var(--smith-surface);border-radius:var(--smith-radius-card);box-shadow:var(--smith-shadow);padding:16px}
.card+.card{margin-top:12px}
.btn{min-height:48px;padding:0 20px;border-radius:var(--smith-radius-control);font:600 16px var(--smith-font-body);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform var(--smith-motion-fast),background var(--smith-motion-standard)}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--smith-accent);color:var(--smith-on-accent);width:100%;min-height:52px}
.btn.sec{background:var(--smith-surface-muted);color:var(--smith-text);min-height:44px}
.btn.ghost{color:var(--smith-accent);min-height:44px}
.btn.danger{background:var(--smith-danger-soft);color:var(--smith-danger)}
.btn[disabled]{opacity:.5}
.chip{min-height:44px;padding:0 14px;border-radius:999px;background:var(--smith-surface);box-shadow:inset 0 0 0 1.5px var(--smith-border-subtle);font:600 14px var(--smith-font-body);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background var(--smith-motion-standard),box-shadow var(--smith-motion-standard)}
.chip[aria-pressed="true"]{background:var(--smith-accent-soft);color:var(--smith-accent);box-shadow:inset 0 0 0 1.5px var(--smith-accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;margin:0 -16px;scrollbar-width:none}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:0 10px;border-radius:999px;background:var(--smith-surface-muted);font:600 12px var(--smith-font-body);color:var(--smith-text)}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--smith-accent));display:block}
.tag.sq i{border-radius:2px}.tag.di i{border-radius:2px;transform:rotate(45deg)}.tag.tr i{width:0;height:0;border-radius:0;background:none;border:5px solid transparent;border-bottom:8px solid var(--c);border-top:0}
.field{width:100%;min-height:48px;border-radius:var(--smith-radius-control);background:var(--smith-surface);box-shadow:inset 0 0 0 1.5px var(--smith-border-strong);padding:0 14px;border:0}
.field:focus{box-shadow:inset 0 0 0 2px var(--smith-accent);outline:none}
.search{position:relative}.search .ico{position:absolute;left:14px;top:13px;color:var(--smith-text-secondary)}.search .field{padding-left:44px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.met{font:800 28px/1 var(--smith-font-display);font-variant-numeric:tabular-nums}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:16px;background:var(--smith-warning-soft);color:var(--smith-text);font-size:14px;line-height:20px}
.notice .ico{flex:none;color:var(--smith-warning)}
.notice.info{background:var(--smith-accent-soft)}.notice.info .ico{color:var(--smith-accent)}
.li{width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--smith-surface);border-radius:var(--smith-radius-card);box-shadow:var(--smith-shadow);margin-bottom:10px;min-height:64px;transition:transform var(--smith-motion-fast)}
.li:active{transform:scale(.985)}
.li .t{font:700 16px/1.3 var(--smith-font-display)}
.li .m{font-size:13px;color:var(--smith-text-secondary)}
.empty{text-align:center;padding:36px 16px;color:var(--smith-text-secondary)}
.progress{height:8px;border-radius:99px;background:var(--smith-surface-muted);overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:var(--smith-accent);border-radius:99px;transition:width var(--smith-motion-standard) linear}
/* ===== bottom nav ===== */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--smith-glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--smith-border-subtle)}
.nav button{position:relative;min-height:56px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:500 12px var(--smith-font-body);color:var(--smith-text-secondary);z-index:0}
.nav button[aria-current="page"]{color:var(--smith-accent);font-weight:700}
.nav .pill{position:absolute;left:0;top:8px;height:56px;border-radius:18px;background:var(--smith-accent-soft);z-index:-1;transition:transform var(--smith-motion-deliberate) var(--smith-spring),width var(--smith-motion-deliberate) var(--smith-spring);pointer-events:none}
/* ===== sheet ===== */
.scrim{position:absolute;inset:0;background:var(--smith-scrim);z-index:40;animation:fade var(--smith-motion-standard) both}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;max-height:88%;overflow-y:auto;background:var(--smith-surface);border-radius:var(--smith-radius-modal) var(--smith-radius-modal) 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up var(--smith-motion-deliberate) var(--smith-spring) both}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font:800 22px/1.2 var(--smith-font-display);margin:0 0 4px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:60;background:var(--smith-text);color:var(--smith-bg);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;animation:rise var(--smith-motion-standard) var(--smith-spring) both;font-size:14px}
.toast button{color:inherit;font-weight:700;text-decoration:underline;min-height:44px;padding:0 6px}
/* ===== library / detail ===== */
.media{aspect-ratio:16/10;border-radius:var(--smith-radius-card);background:linear-gradient(160deg,var(--smith-accent-soft),var(--smith-surface-muted));display:grid;place-items:center;text-align:center;padding:16px;color:var(--smith-text-secondary);font-size:13px;position:relative;overflow:hidden}
.media svg{width:92px;height:92px;opacity:.9}
.media .lab{position:absolute;left:12px;bottom:10px;right:12px;font-size:12px}
.fav{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--smith-text-secondary)}
.fav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2}
.fav[aria-pressed="true"]{color:var(--smith-accent)}.fav[aria-pressed="true"] svg{fill:currentColor;animation:pop var(--smith-motion-deliberate) var(--smith-bouncy)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.acc{border-radius:var(--smith-radius-card);background:var(--smith-surface);box-shadow:var(--smith-shadow);margin-top:10px;overflow:hidden}
.acc>button{width:100%;min-height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;font:700 16px var(--smith-font-display);text-align:left}
.acc .chev{transition:transform var(--smith-motion-standard) var(--smith-spring)}
.acc[data-open="true"] .chev{transform:rotate(90deg)}
.acc .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows 220ms var(--smith-spring)}
.acc[data-open="true"] .body{grid-template-rows:1fr}
.acc .body>div{overflow:hidden}.acc .inner{padding:0 16px 16px}
ol.steps{margin:0;padding-left:22px}ol.steps li{margin:6px 0}
/* ===== builder ===== */
.step{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px;background:var(--smith-surface);border-radius:18px;box-shadow:var(--smith-shadow);margin-bottom:8px;animation:rise var(--smith-motion-standard) var(--smith-spring) both}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--smith-surface-muted);display:grid;place-items:center;font:700 13px var(--smith-font-display);flex:none}
.stepper{display:inline-flex;align-items:center;background:var(--smith-surface-muted);border-radius:12px}
.stepper button{width:36px;height:44px;font:700 18px var(--smith-font-display)}
.stepper span{min-width:52px;text-align:center;font:700 14px var(--smith-font-display);font-variant-numeric:tabular-nums}
.mini{width:36px;height:44px;display:grid;place-items:center;color:var(--smith-text-secondary)}
.mini[disabled]{opacity:.3}
/* ===== player ===== */
#player{position:absolute;inset:0;z-index:30;background:var(--smith-bg);display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));animation:rise var(--smith-motion-deliberate) var(--smith-spring) both}
.pl-top{display:flex;align-items:center;justify-content:space-between;min-height:52px}
.pl-body{flex:1;display:flex;flex-direction:column;gap:12px;overflow-y:auto;min-height:0}
.pl-step{animation:swap var(--smith-motion-deliberate) var(--smith-spring) both}
@keyframes swap{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.ring{position:relative;width:176px;height:176px;margin:0 auto;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--smith-surface-muted)}.ring .fg{stroke:var(--smith-accent);stroke-linecap:round}
.ring .val{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .val b{font:800 46px/1 var(--smith-font-display);font-variant-numeric:tabular-nums}
.ring .val span{font-size:13px;color:var(--smith-text-secondary)}
.side{align-self:center;min-height:36px;padding:0 16px;border-radius:99px;background:var(--smith-accent-soft);color:var(--smith-accent);font:800 15px var(--smith-font-display);display:inline-flex;align-items:center}
.ctl{display:grid;grid-template-columns:1fr 84px 1fr;align-items:center;gap:12px;margin-top:8px}
.ctl .big{width:84px;height:84px;border-radius:50%;background:var(--smith-accent);color:var(--smith-on-accent);display:grid;place-items:center;transition:transform var(--smith-motion-fast) var(--smith-spring)}
.ctl .big:active{transform:scale(.94)}
.ctl .big svg{width:34px;height:34px;fill:currentColor;stroke:none}
.ctl .sidebtn{min-height:56px;border-radius:18px;background:var(--smith-surface-muted);display:flex;align-items:center;justify-content:center;gap:6px;font:700 14px var(--smith-font-display)}
.ctl2{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.check{width:84px;height:84px;margin:8px auto}
.check circle{fill:none;stroke:var(--smith-positive);stroke-width:5;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s var(--smith-spring) forwards}
.check path{fill:none;stroke:var(--smith-positive);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .4s .3s var(--smith-spring) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
html[data-motion="reduce"] .check circle,html[data-motion="reduce"] .check path{animation:none;stroke-dashoffset:0}
@media (prefers-reduced-motion:reduce){.check circle,.check path{animation:none;stroke-dashoffset:0}}
/* ===== start screen (same timeline as Runsmith/Repsmith, docs/MOTION.md) ===== */
#splash{position:absolute;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:22px;background:var(--smith-bg);transition:opacity .26s cubic-bezier(.4,0,.2,1)}
#splash.out{opacity:0;pointer-events:none}
#splash[hidden]{display:none}
.sp-tile{width:120px;height:120px;display:block;animation:sp-tile .42s var(--smith-spring) both}
.sp-rv{stroke-dasharray:1.05;stroke-dashoffset:1.05;animation:draw var(--t) var(--d) cubic-bezier(.4,0,.2,1) forwards}
.sp-head{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:sp-head .3s .78s var(--smith-bouncy) forwards}
.sp-name{margin:0;font:800 26px/1 var(--smith-font-display);letter-spacing:-.02em;opacity:0;animation:sp-name .3s .94s cubic-bezier(.2,0,0,1) forwards}
.sp-end{position:absolute;width:0;height:0;animation:sp-end 1.6s linear both}
@keyframes sp-tile{0%{opacity:0;transform:scale(.88)}35%{opacity:1}100%{opacity:1;transform:none}}
@keyframes sp-head{to{transform:scale(1)}}
@keyframes sp-name{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sp-end{from{opacity:.99}to{opacity:1}}
html[data-motion="reduce"] .sp-tile,html[data-motion="reduce"] .sp-name,html[data-motion="reduce"] .sp-rv,html[data-motion="reduce"] .sp-head,html[data-motion="reduce"] .sp-end{animation:none}
html[data-motion="reduce"] .sp-rv{stroke-dashoffset:0}html[data-motion="reduce"] .sp-head{transform:none}html[data-motion="reduce"] .sp-name{opacity:1}
@media (prefers-reduced-motion:reduce){.sp-tile,.sp-name,.sp-rv,.sp-head,.sp-end{animation:none}.sp-rv{stroke-dashoffset:0}.sp-head{transform:none}.sp-name{opacity:1}}
.legend{position:fixed;left:12px;bottom:12px;font-size:12px;color:var(--smith-text-secondary);background:var(--smith-surface);padding:8px 12px;border-radius:12px;box-shadow:var(--smith-shadow);max-width:260px;z-index:200}
@media (max-width:599px){.legend{display:none}}
</style>

<body>
<div id="stage"><div id="phone" aria-label="Flexsmith"></div></div>
<div class="legend">Prototyp do akceptacji. Dane w przeglądarce (localStorage <code>flexsmith.proto</code>), bez sieci. Treści ćwiczeń do przeglądu, demonstracje wideo/wektorowe są w tym prototypie zastąpione ramką.</div>
<script>
'use strict';
/* ================= data (prototype seed: real, reviewable content; production target is 35-50 entries with a QA manifest) ================= */
const L = (pl, en) => ({ pl, en });
const TYPES = {
  prep: { c: 'var(--t-prep)', cls: '',   n: L('Dynamiczna', 'Dynamic'),        d: L('Ruch przygotowujący, bez długiego trzymania', 'Movement preparation, no long holds') },
  mob:  { c: 'var(--t-mob)',  cls: 'di', n: L('Mobilność', 'Mobility'),        d: L('Kontrolowany ruch w zakresie', 'Controlled movement through range') },
  stat: { c: 'var(--t-stat)', cls: 'sq', n: L('Statyczne', 'Static stretch'),  d: L('Spokojne wytrzymanie pozycji', 'A calm held position') },
  roll: { c: 'var(--t-roll)', cls: 'tr', n: L('Rolowanie', 'Foam rolling'),    d: L('Opcjonalne, z wałkiem', 'Optional, with a roller') },
};
const AREAS = { ankles: L('Kostki', 'Ankles'), calves: L('Łydki', 'Calves'), hips: L('Biodra', 'Hips'), glutes: L('Pośladki', 'Glutes'), hams: L('Tył uda', 'Hamstrings'), quads: L('Przód uda', 'Quads'), thor: L('Odcinek piersiowy', 'Thoracic'), shoulders: L('Barki', 'Shoulders'), full: L('Całe ciało', 'Full body') };
const EQ = { none: L('Bez sprzętu', 'No equipment'), mat: L('Mata', 'Mat'), roller: L('Wałek', 'Foam roller') };
/* mode 'time': dur seconds (per side when sides); mode 'reps': reps (per side when sides), spr = seconds per rep for the estimate */
const EX = [
  { id: 'march', t: 'prep', a: 'full', eq: 'none', mode: 'time', dur: 30, sides: false, n: L('Marsz z unoszeniem kolan', 'Marching knee lifts'),
    how: L('Rytmiczny marsz w miejscu, który podnosi tętno i uczy koordynacji przed biegiem.', 'Rhythmic marching in place that raises heart rate and coordination before a run.'),
    steps: L(['Stań prosto, stopy na szerokość bioder.', 'Unoś kolano do wysokości bioder, przeciwna ręka idzie do przodu.', 'Utrzymaj lekki, równy rytm i wysoką sylwetkę.'], ['Stand tall, feet hip-width.', 'Lift a knee to hip height, opposite arm swings forward.', 'Keep an easy, even rhythm and a tall posture.']),
    err: L(['Garbienie się i opadanie klatki.', 'Zbyt szybkie tempo kosztem kontroli.'], ['Slouching and a collapsing chest.', 'Going fast at the cost of control.']),
    easy: L('Niżej unoś kolana.', 'Lift the knees lower.'), hard: L('Dodaj lekkie podskoki.', 'Add small hops.'),
    caut: L('Przy bólu stopy lub kolana zmniejsz zakres albo przerwij.', 'If foot or knee hurts, reduce the range or stop.') },

  acc: id => { const a = $('#acc-' + id); const o = a.dataset.open !== 'true'; a.dataset.open = o; a.querySelector('button').setAttribute('aria-expanded', o); },
  adjust: () => { ui.sheet = { t: 'adjust' }; renderOverlays(); }, closeSheet: () => { ui.sheet = null; render(); },
  setGoal: id => { st.goal = id; save(); ui.sheet = { t: 'adjust' }; render(); }, setTime: id => { st.time = +id; save(); ui.sheet = { t: 'adjust' }; render(); },
  setEq: id => { st.equip = st.equip.includes(id) ? st.equip.filter(x => x !== id) : [...st.equip, id]; save(); ui.sheet = { t: 'adjust' }; render(); },
  quick: id => { st.goal = id; save(); const r = recommend(); if (r.s) { ui.page = { t: 'session', id: r.s.id }; renderOverlays(); } else toast(tr('empty')); },
  startRec: id => startPlayer(SESSIONS.find(s => s.id === id)),
  startSess: (id, el) => { const mine = el.dataset.mine === '1'; const s = mine ? routineAsSession(st.routines.find(r => r.id === id)) : SESSIONS.find(x => x.id === id); startPlayer(s); },
  resume: () => { const s = SESSIONS.concat(st.routines.map(routineAsSession)).find(x => x.id === st.paused.sid); const ps = st.paused; startPlayer(s, { pi: ps.pi, active: ps.active }); },
  fint: id => { ui.filt.intent = id; render(); }, ftype: id => { ui.lib.type = id; render(); }, ffav: () => { ui.lib.fav = !ui.lib.fav; render(); },
  set: (_, el) => { st[el.dataset.k] = el.dataset.v; save(); render(); }, tog: (_, el) => { st[el.dataset.k] = !st[el.dataset.k]; save(); render(); },
  hist: () => { ui.page = { t: 'hist' }; renderOverlays(); },
  export: () => { try { const blob = new Blob([JSON.stringify({ app: 'flexsmith', schema: 1, exportedAt: new Date().toISOString(), data: st }, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'flexsmith-backup.json'; a.click(); toast(tr('exportOk')); } catch { toast('!'); } },
  replay: () => { playSplash(0); },
  newR: () => { const r = { id: 'r' + Date.now(), n: tr('newS'), steps: [] }; st.routines.push(r); save(); ui.tab = 'mine'; ui.page = { t: 'edit', id: r.id }; render(); },
  editR: id => { ui.page = { t: 'edit', id }; renderOverlays(); },
  copyS: id => { const s = SESSIONS.find(x => x.id === id); const r = { id: 'r' + Date.now(), n: tr('copyOf') + nm(s.n), steps: s.steps.map(x => ({ ...x })) }; st.routines.push(r); save(); ui.page = { t: 'edit', id: r.id }; renderOverlays(); },
  dupR: () => { const r = st.routines.find(x => x.id === ui.page.id); const c = { id: 'r' + Date.now(), n: r.n + ' (2)', steps: r.steps.map(x => ({ ...x })) }; st.routines.push(c); save(); ui.page = { t: 'edit', id: c.id }; renderOverlays(); toast(tr('routineSaved')); },
  delR: () => { const r = st.routines.find(x => x.id === ui.page.id); ui.sheet = { t: 'confirm', msg: tr('delQ', { n: r.n }), what: 'routine', id: r.id }; renderOverlays(); },
  confirmDel: () => { st.routines = st.routines.filter(x => x.id !== ui.sheet.id); save(); ui.sheet = null; ui.page = null; render(); },
  saveR: () => { const r = st.routines.find(x => x.id === ui.page.id); r.n = $('#rn').value.trim() || r.n; save(); toast(tr('routineSaved')); ui.page = null; render(); },
  stepdur: (_, el) => { const r = st.routines.find(x => x.id === ui.page.id); const i = +el.dataset.i; const e = exById(r.steps[i].ex); const v = (r.steps[i].dur ?? e.dur) + +el.dataset.d; r.steps[i].dur = Math.max(e.mode === 'time' ? 5 : 1, Math.min(e.mode === 'time' ? 300 : 40, v)); save(); redrawEditor(); },
  mv: (_, el) => { const r = st.routines.find(x => x.id === ui.page.id); const i = +el.dataset.i, d = +el.dataset.d; const j = i + d; if (j < 0 || j >= r.steps.length) return; [r.steps[i], r.steps[j]] = [r.steps[j], r.steps[i]]; save(); redrawEditor(); },
  rmStep: (_, el) => { const r = st.routines.find(x => x.id === ui.page.id); const i = +el.dataset.i; const [gone] = r.steps.splice(i, 1); ui.undo = () => { r.steps.splice(i, 0, gone); save(); redrawEditor(); }; save(); redrawEditor(); toast(tr('removed'), true); },
  undo: () => { ui.undo?.(); ui.undo = null; ui.toast = null; renderOverlays(); },
  addEx: () => { ui.sheet = { t: 'pick', q: '' }; renderOverlays(); },
  pickEx: id => { const r = st.routines.find(x => x.id === ui.page.id); r.steps.push({ ex: id }); save(); ui.sheet = null; renderOverlays(); },
  addTo: id => { ui.sheet = { t: 'pickRoutine', ex: id }; renderOverlays(); },
  addToR: id => { const r = st.routines.find(x => x.id === id); r.steps.push({ ex: ui.sheet.ex }); save(); ui.sheet = null; renderOverlays(); toast(tr('routineSaved') + ': ' + r.n); },
  addToNew: () => { const r = { id: 'r' + Date.now(), n: tr('newS'), steps: [{ ex: ui.sheet.ex }] }; st.routines.push(r); save(); ui.sheet = null; ui.tab = 'mine'; ui.page = { t: 'edit', id: r.id }; render(); },
  plClose: () => { if (P) { acct(); st.paused = { sid: P.sid, pi: P.i, active: P.doneActive }; save(); } closePlayer(); render(); },
  plPause: () => pausePlayer(), plNext: () => advance(1), plPrev: () => advance(-1), plDone: () => advance(1),
  plAdj: (_, el) => { const p = cur(); const l = left() + +el.dataset.d; const nv = Math.max(5, Math.round(p.val + +el.dataset.d)); P.ph.forEach(q => { if (q.i === p.i) q.val = nv; }); P.mod = true; if (P.running) P.endAt = performance.now() + Math.max(1, l) * 1000; else P.remain = Math.max(1, l); tickPlayer(); },
  plSwap: () => swapEx(), plFinish: () => finishPlayer(false),
  cmf: (_, el) => { phone.querySelectorAll('#cm .chip').forEach(b => b.setAttribute('aria-pressed', b === el ? 'true' : 'false')); },
  plSave: (_, el) => { const c = phone.querySelector('#cm .chip[aria-pressed="true"]'); st.hist.unshift({ id: 'h' + Date.now(), at: Date.now(), name: P.name, sid: P.sid, done: el.dataset.c === '1', actual: +el.dataset.act, planned: Math.round(P.plannedSec), comfort: c?.dataset.id || null, modified: P.mod, note: $('#nt').value.trim() }); st.paused = null; save(); closePlayer(); ui.tab = 'today'; ui.page = null; render(false); },
};
function redrawEditor() { const r = st.routines.find(x => x.id === ui.page.id); const e = estimate(r.steps);
  $('#steps').innerHTML = r.steps.map((x, i) => stepRow(x, i, r.steps.length)).join('') || `<div class="empty">${tr('empty')}</div>`;
  $('#tot').textContent = fmt(e.total); $('#calc').textContent = tr('calc', { w: e.ph, work: fmt(e.work), n: Math.max(0, e.ph - 1), t: TRANS }); }
phone.addEventListener('click', ev => { const t = ev.target.closest('[data-a]'); if (!t) return; const f = act[t.dataset.a]; if (f) { ev.preventDefault(); f(t.dataset.id, t); } });
phone.addEventListener('input', ev => { const t = ev.target;
  if (t.id === 'sq') { ui.filt.q = t.value; const q = t.value.trim().toLowerCase(); $('#slist').innerHTML = SESSIONS.filter(s => (ui.filt.intent === 'all' || s.intent === ui.filt.intent) && (!q || nm(s.n).toLowerCase().includes(q))).map(sessCard).join('') || `<div class="empty">${tr('empty')}</div>`; }
  if (t.id === 'lq') { ui.lib.q = t.value; const q = t.value.trim().toLowerCase(); $('#llist').innerHTML = libList(EX.filter(e => (ui.lib.type === 'all' || e.t === ui.lib.type) && (!ui.lib.fav || st.favs.includes(e.id)) && (!q || nm(e.n).toLowerCase().includes(q) || nm(AREAS[e.a]).toLowerCase().includes(q)))); }
  if (t.id === 'pq') { ui.sheet.q = t.value; const q = t.value.toLowerCase(); $('#plist').innerHTML = pickList(EX.filter(e => !q || nm(e.n).toLowerCase().includes(q))); } });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { if (ui.sheet) act.closeSheet(); else if (P) {} else if (ui.page) act.back(); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (st.theme === 'system') render(); });
window.addEventListener('resize', () => placePill(NAV.findIndex(n => n[0] === ui.tab), false));
/* ================= boot ================= */
render(false);
const q = new URLSearchParams(location.search);
if (q.get('nosplash') !== '1') playSplash(120); else window.__splashDone = true;
window.__flex = { st, get P() { return P; }, act, ui, estimate, SESSIONS, EX, recommend, phases };
</script>
</body>
